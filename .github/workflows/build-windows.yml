# Teste REKA Taskbar puis construit « REKA-Taskbar.exe » sur une machine
# Windows de GitHub à chaque push. L'exe est joint à l'exécution (artefact).
#
# Publication des mises à jour (les barres installées lisent le version.json
# de la dernière release et se mettent à jour toutes seules) :
# - un push sur la branche principale avec une APP_VERSION (core/config.py)
#   encore jamais publiée publie la release « v<version> » toute seule, une
#   fois tous les tests passés (dont une vraie mise à jour de bout en bout) ;
# - publier une release sur GitHub, ou pousser un tag « v1.2.3 », y ajoute
#   l'exe et son version.json ; « Run workflow » avec un tag complète une
#   release existante. La version vient toujours d'APP_VERSION, pas du tag.
name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:                # (ne filtre que les pushs de branches)
      - "reka_taskbar/**"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag d'une release existante à compléter avec l'exe (vide : simple build)"
        required: false
        default: ""

env:
  # Les scripts Python du build écrivent des accents et des flèches : sans ça,
  # la console Windows (cp1252) les refuse et le build échoue
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # Release à remplir : celle qui vient d'être publiée, le tag poussé, ou celle demandée
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-linux:
    name: Tests (Linux, Qt hors écran)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reka_taskbar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances système (Qt hors écran)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build-windows:
    name: Tests + build de l'exe (Windows)
    needs: tests-linux
    runs-on: windows-latest
    permissions:
      contents: write          # release, sur un tag « v… » seulement
    defaults:
      run:
        working-directory: reka_taskbar
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt pytest
      - name: Tests (Qt hors écran)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Tests Win32 (vraies fenêtres, ancrage, tubes nommés, registre)
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q -rs tests/test_win32.py
      - name: Infos du build (mises à jour automatiques)
        run: |
          python - <<'PY'
          import json, os, re, sys
          source = open("core/config.py", encoding="utf-8").read()
          version = re.search(r'^APP_VERSION = "([^"]+)"', source, re.M).group(1)
          tag = os.environ.get("RELEASE_TAG", "")
          if tag and tag.lstrip("vV") != version:
              print(f"::warning::Release « {tag} » : l'exe sera la version {version} (APP_VERSION)")
          info = {"version": version, "repo": os.environ["GITHUB_REPOSITORY"],
                  "commit": os.environ["GITHUB_SHA"]}
          json.dump(info, open("build_info.json", "w", encoding="utf-8"), indent=2)
          print(info)
          PY
      - name: Release à publier ?
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, urllib.request
          info = json.load(open("build_info.json", encoding="utf-8"))
          version = info["version"]
          target = os.environ.get("RELEASE_TAG", "")

          def key(value):
              return tuple(int(n) for n in re.findall(r"\d+", value)[:4])

          automatic = (not target and os.environ["GITHUB_EVENT_NAME"] == "push"
                       and os.environ["GITHUB_REF_TYPE"] == "branch"
                       and os.environ["GITHUB_REF_NAME"] == os.environ["DEFAULT_BRANCH"])
          if automatic:
              exists = subprocess.run(["gh", "release", "view", f"v{version}"],
                                      capture_output=True).returncode == 0
              try:
                  url = f"https://github.com/{info['repo']}/releases/latest/download/version.json"
                  online = json.load(urllib.request.urlopen(url, timeout=20))["version"]
              except Exception:
                  online = ""
              if exists:
                  print(f"La version {version} est déjà publiée : pas de nouvelle release "
                        "(augmente APP_VERSION dans core/config.py pour en publier une).")
              elif online and key(online) >= key(version):
                  print(f"::warning::APP_VERSION {version} n'est pas plus récente que la "
                        f"dernière release ({online}) : rien n'est publié.")
              else:
                  target = f"v{version}"
                  print(f"Nouvelle version {version} (en ligne : {online or 'aucune'}) : "
                        f"la release {target} sera publiée si tous les tests passent.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TARGET_TAG={target}\n")
          PY
      - name: Build PyInstaller
        run: python -m PyInstaller --noconfirm --clean build.spec
      - name: Propriétés de l'exe (version, développeurs)
        shell: pwsh
        run: |
          $info = (Get-Item dist/REKA-Taskbar.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileDescription, CompanyName
          if ($info.ProductName -ne "REKA Taskbar") { throw "Propriétés absentes de l'exe" }
      - name: Auto-test de l'exe (rendu de la barre en mode démo)
        env:
          APPDATA: ${{ runner.temp }}/appdata
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p selftest "$APPDATA"
          "./dist/REKA-Taskbar.exe" --selftest "$(pwd -W)/selftest/barre.png"
          cat selftest/barre.txt
          grep -q "RÉSULTAT : OK" selftest/barre.txt
      - name: Auto-test avec l'affichage réel de Windows (indicatif)
        continue-on-error: true
        env:
          APPDATA: ${{ runner.temp }}/appdata-ecran
        run: |
          mkdir -p selftest/ecran "$APPDATA"
          "./dist/REKA-Taskbar.exe" --selftest "$(pwd -W)/selftest/ecran/barre.png"
          cat selftest/ecran/barre.txt
      - name: Remplacement de l'exe pendant qu'il tourne (mise à jour)
        env:
          APPDATA: ${{ runner.temp }}/appdata-maj
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p "$APPDATA"
          python - <<'PY'
          import os, shutil, subprocess, sys, tempfile, time
          from pathlib import Path
          sys.path.insert(0, ".")
          from core.updater import cleanup_previous, install, old_exe_path

          folder = Path(tempfile.mkdtemp())
          running = folder / "REKA-Taskbar.exe"
          shutil.copy("dist/REKA-Taskbar.exe", running)
          new = folder / "nouveau.exe"
          shutil.copy("dist/REKA-Taskbar.exe", new)
          with open(new, "ab") as f:
              f.write(b"nouvelle version")          # pour reconnaître le nouvel exe
          process = subprocess.Popen([str(running), "--demo"])
          time.sleep(8)
          assert process.poll() is None, "la barre en démo s'est arrêtée"
          install(new, running)                      # pendant qu'elle tourne
          assert running.read_bytes().endswith(b"nouvelle version"), "nouvel exe absent"
          assert old_exe_path(running).is_file(), "ancien exe absent"
          print("Exe remplacé pendant qu'il tourne : OK")
          # L'exe PyInstaller lance un second processus : on arrête tout l'arbre
          subprocess.run(["taskkill", "/PID", str(process.pid), "/T", "/F"], check=False)
          process.wait(30)
          for _ in range(20):
              if cleanup_previous(running):
                  break
              time.sleep(0.5)
          assert not old_exe_path(running).exists(), "ancien exe non supprimé"
          print("Ancien exe supprimé après l'arrêt : OK")
          PY
      - name: Mise à jour de bout en bout (téléchargement, gardien, redémarrage)
        run: python tests/e2e_update.py success
      - name: Mise à jour qui ne démarre pas (retour automatique à l'ancienne version)
        run: python tests/e2e_update.py rollback
      - name: Description de la mise à jour (version.json) et notes de version
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, re
          info = json.load(open("build_info.json", encoding="utf-8"))
          data = open("dist/REKA-Taskbar.exe", "rb").read()
          # Notes de cette version : sa section de NOUVEAUTES.md
          text = open("NOUVEAUTES.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(info['version'])}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          notes = match.group(1).strip() if match else ""
          open("dist/notes.md", "w", encoding="utf-8").write(notes or f"REKA Taskbar {info['version']}")
          short = "\n".join("• " + line.strip().lstrip("-* ").strip() for line in notes.splitlines()
                            if line.strip().startswith(("-", "*")))
          if len(short) > 900:
              short = short[:900].rsplit("\n", 1)[0] + "\n…"
          tag = os.environ.get("TARGET_TAG") or "v" + info["version"]
          update = {"version": info["version"], "commit": info["commit"],
                    "url": f"https://github.com/{info['repo']}/releases/download/{tag}/REKA-Taskbar.exe",
                    "sha256": hashlib.sha256(data).hexdigest(), "size": len(data), "notes": short,
                    "published": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")}
          json.dump(update, open("dist/version.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(update, ensure_ascii=False, indent=2))
          PY
      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: REKA-Taskbar
          path: |
            reka_taskbar/dist/REKA-Taskbar.exe
            reka_taskbar/dist/version.json
            reka_taskbar/selftest/
      - name: Release (exe, version.json, notes)
        if: env.TARGET_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat dist/notes.md
            printf '\n\n---\n\nTélécharge **REKA-Taskbar.exe** et lance-le : rien à installer. '
            printf 'Les barres déjà installées se mettent à jour toutes seules.\n'
            printf 'Pour voir la barre sans Voicemeeter ni REKA : `REKA-Taskbar.exe --demo`.\n'
          } > dist/release-notes.md
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            # Release créée sur GitHub : on y ajoute les fichiers, sans toucher à ce qui y est écrit
            gh release upload "$TARGET_TAG" dist/REKA-Taskbar.exe dist/version.json --clobber
            body=$(gh release view "$TARGET_TAG" --json body --jq .body)
            if [ -z "${body//[[:space:]]/}" ]; then
              gh release edit "$TARGET_TAG" --notes-file dist/release-notes.md
            fi
          else
            # Nouvelle version : release (et tag) créées sur ce commit
            gh release create "$TARGET_TAG" dist/REKA-Taskbar.exe dist/version.json \
              --target "$GITHUB_SHA" --latest \
              --title "REKA Taskbar $TARGET_TAG" \
              --notes-file dist/release-notes.md
          fi
          gh release view "$TARGET_TAG" --json assets --jq '.assets[].name'
      - name: La release est bien celle que lisent les barres installées
        if: env.TARGET_TAG != ''
        run: |
          # releases/latest/download/version.json doit mener à cet exe
          python - <<'PY'
          import json, time, urllib.request
          info = json.load(open("build_info.json", encoding="utf-8"))
          local = json.load(open("dist/version.json", encoding="utf-8"))
          url = f"https://github.com/{info['repo']}/releases/latest/download/version.json"
          for attempt in range(6):
              try:
                  online = json.load(urllib.request.urlopen(url, timeout=20))
                  break
              except Exception as exc:
                  print(f"essai {attempt + 1} : {exc}")
                  time.sleep(10)
          else:
              raise SystemExit(f"{url} injoignable")
          print(json.dumps(online, ensure_ascii=False, indent=2))
          if online["sha256"] != local["sha256"]:
              print("::warning::La dernière release n'est pas celle-ci (brouillon, pré-version, ou plus récente)")
          else:
              print("Les barres installées verront cette version : OK")
          PY
